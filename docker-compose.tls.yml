# Optional TLS layer. Use it together with the base file:
#
#   GMS_DOMAIN=school.example.com docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# The auth cookie is HttpOnly + Secure, so a browser discards it over plain HTTP on any
# origin that is not localhost. In practice the application only works behind TLS, which
# is the reason this file exists and why the API port below is not published publicly.
services:
  caddy:
    image: caddy:2-alpine
    container_name: gms-caddy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    environment:
      # A DNS name pointing at this host gets a Let's Encrypt certificate. `localhost`
      # gets Caddy's internal CA, which is what the smoke test uses.
      GMS_DOMAIN: ${GMS_DOMAIN:?GMS_DOMAIN must be set, e.g. school.example.com}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and account keys live here. Losing this volume means re-issuing, and
      # Let's Encrypt rate-limits that; losing it is not a data loss.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - gms-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
