services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: gms-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-gms}
      POSTGRES_USER: ${DB_USERNAME:-gms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gms_user} -d ${DB_NAME:-gms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gms-network

  # Spring Boot Backend
  backend:
    build:
      context: ./gms_backend
      dockerfile: Dockerfile
    container_name: gms-backend
    env_file:
      - .env
    environment:
      # Only values that differ because they are inside the compose network.
      # Everything else (SECURITY_JWT_SECRET, APP_SUPERADMIN_*, MAIL_*) arrives from .env:
      # an `environment:` entry here would silently override the env_file value.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-gms}
      DB_USERNAME: ${DB_USERNAME:-gms_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gms-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # React Frontend
  frontend:
    build:
      context: ./gms_frontend
      dockerfile: Dockerfile
    container_name: gms-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gms-network

volumes:
  postgres_data:
    driver: local

networks:
  gms-network:
    driver: bridge

