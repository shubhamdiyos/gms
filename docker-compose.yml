# Bounded container logs. The default json-file driver grows without limit, so a long-running
# install eventually fills the host disk and the whole stack stops writing -- including the
# database's own WAL. 10 MB x 3 is enough history for an incident.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: gms-postgres
    # Without a restart policy a host reboot, a Docker daemon update, or any non-zero exit leaves
    # the install down until a human notices. `unless-stopped` restarts on failure and on boot but
    # still honours an explicit `docker compose stop`.
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-gms}
      POSTGRES_USER: ${DB_USERNAME:-gms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      # Loopback only, and on a port this file actually controls. Two defects closed at once:
      # publishing 5432 on 0.0.0.0 exposed the database on every interface, and binding the
      # default 5432 collided with any host-side PostgreSQL — which failed silently, so the
      # backend talked to the host server while `compose ps` advertised the container
      # (INFRASTRUCTURE_AUDIT: DB_PORT "believed they have configured something").
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gms_user} -d ${DB_NAME:-gms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gms-network

  # Spring Boot Backend
  backend:
    build:
      context: ./gms_backend
      dockerfile: Dockerfile
    container_name: gms-backend
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      # Only values that differ because they are inside the compose network.
      # Everything else (SECURITY_JWT_SECRET, APP_SUPERADMIN_*, MAIL_*) arrives from .env:
      # an `environment:` entry here would silently override the env_file value.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-gms}
      DB_USERNAME: ${DB_USERNAME:-gms_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      # Loopback only. The SPA reaches the API through the frontend's nginx on gms-network,
      # and a real deployment terminates TLS in front of that (docker-compose.tls.yml). A
      # public 8080 is a plaintext route around both, so it is not published.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gms-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # React Frontend
  frontend:
    build:
      context: ./gms_frontend
      dockerfile: Dockerfile
    container_name: gms-frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Loopback only, for the same reason as the backend: everything a browser uses goes
      # through the TLS terminator in front of this service.
      - "127.0.0.1:3000:80"
    depends_on:
      # `service_healthy`, not the bare list form. A static asset bundle that starts before the
      # API is answering is not broken -- it just serves a page whose first request 502s -- which
      # is exactly the kind of failure that gets blamed on the browser. The healthcheck below is
      # what makes that condition mean something.
      backend:
        condition: service_healthy
    networks:
      - gms-network
    healthcheck:
      # busybox wget is present in every alpine-derived image and curl is not, so this is the
      # same probe shape the backend healthcheck uses -- against the static root, which nginx
      # answers without touching the build output.
      # 127.0.0.1, not localhost: inside a container localhost may resolve to ::1 first, and
      # nginx listens on IPv4 only, so the probe failed for a container that was serving.
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local

networks:
  gms-network:
    driver: bridge

