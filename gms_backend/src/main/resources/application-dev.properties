# ─────────────────────────────────────────────────────────────────────────────
# Local development profile — activate with
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   java -jar target/gms-*.jar --spring.profiles.active=dev
#
# This is the only profile that may carry convenience values, and every value
# below points at the PostgreSQL container started by `docker compose up postgres`.
# Nothing here is usable in a deployment: StartupSecurityValidator runs for every
# other profile combination, including the no-profile case.
# ─────────────────────────────────────────────────────────────────────────────

# Local container credentials from docker-compose.yml. Override with your own
# DB_URL / DB_USERNAME / DB_PASSWORD if you run Postgres elsewhere.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gms}
spring.datasource.username=${DB_USERNAME:gms_user}
spring.datasource.password=${DB_PASSWORD:gms_password}

# Temporary: the Flyway baseline (mandate §9) does not exist yet, and the schema
# is only reproducible through Hibernate. Deleted once db/migration/V1__baseline.sql lands.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Local Vite dev server and the mobile browser.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Local SMTP is absent, so outbound mail fails fast rather than hanging on a
# remote host. Mail delivery is exercised in a real environment only.
spring.mail.host=${MAIL_HOST:localhost}

logging.level.com.gms=${LOG_LEVEL_COM_GMS:DEBUG}

# No platform account is created from a committed password — that is finding
# SEC-01 in miniature. Start the app with your own value to bootstrap one:
#   APP_SUPERADMIN_ENABLED=true APP_SUPERADMIN_USERNAME=devadmin \
#   APP_SUPERADMIN_PASSWORD='a-passphrase-only-you-know' \
#   APP_SUPERADMIN_EMAIL=devadmin@localhost mvn spring-boot:run -Dspring-boot.run.profiles=dev
app.superadmin.enabled=${APP_SUPERADMIN_ENABLED:false}
app.superadmin.username=${APP_SUPERADMIN_USERNAME:}
app.superadmin.password=${APP_SUPERADMIN_PASSWORD:}
app.superadmin.email=${APP_SUPERADMIN_EMAIL:}
app.superadmin.full-name=${APP_SUPERADMIN_FULL_NAME:}
