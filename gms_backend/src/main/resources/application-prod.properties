# ─────────────────────────────────────────────────────────────────────────────
# Production profile — activate with
#   java -jar target/gms-*.jar --spring.profiles.active=prod
#
# Every value a deployment owns (DB_URL, DB_USERNAME, DB_PASSWORD,
# SECURITY_JWT_SECRET, APP_SUPERADMIN_*, CORS_ALLOWED_ORIGINS, MAIL_*) arrives
# from the environment. There are no credentials and no permissive fallbacks in
# this file, and StartupSecurityValidator aborts the boot when one is missing.
# ─────────────────────────────────────────────────────────────────────────────

# Migrations only. `update` is refused here and by the validator, so a boot can
# never alter a live schema (OPS-07, mandate §9).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.gms=${LOG_LEVEL_COM_GMS:INFO}

# Anonymous actuator is limited to the health probes by SecurityConfig; details
# stay off so the payload cannot name the database or mail host (SEC-13).
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# The platform account is created by an operator decision, never implicitly.
app.superadmin.enabled=${APP_SUPERADMIN_ENABLED:false}

# A real SMTP host is required for notifications in this profile.
spring.mail.host=${MAIL_HOST:}
