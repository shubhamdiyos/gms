spring.application.name=gms

# ─────────────────────────────────────────────────────────────────────────────
# There are deliberately no environment-specific values in this file.
#
#   * No database credential may live here — the datasource is injected.
#   * No JWT secret may live here — see security.jwt.secret below.
#   * No bootstrap administrator password may live here.
#
# Every value a deployment needs has a name documented in .env.example, and
# config/StartupSecurityValidator fails the boot when one of them is missing or
# weak under the `prod` profile. Copying a credential into this file is finding
# SEC-01 and must not recur.
# ─────────────────────────────────────────────────────────────────────────────

server.port=${SERVER_PORT:8080}

# ── Database ─────────────────────────────────────────────────────────────────
# DB_URL / DB_USERNAME / DB_PASSWORD are mandatory. Defaults are intentionally
# empty so that the application cannot silently fall back to any environment —
# in particular it can no longer connect to a hosted database just because a
# developer typed `mvn spring-boot:run` (the trap described in
# docs/audit/BASELINE_STATUS.md §5).
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ──────────────────────────────────────────────────────────────────────
# `validate` is the default for every profile. Only application-dev.properties
# may relax it, and that relaxation is deleted once Flyway baselines exist
# (mandate §9.1, finding OPS-07).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── Flyway ───────────────────────────────────────────────────────────────────
# Enabled here but inert until the flyway-core dependency and db/migration exist.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

# ── Security ─────────────────────────────────────────────────────────────────
# No default value: a missing secret must not resolve to a known key (SEC-02).
security.jwt.secret=${SECURITY_JWT_SECRET:}
security.jwt.validity-seconds=${SECURITY_JWT_VALIDITY_SECONDS:3600}
security.jwt.issuer=${SECURITY_JWT_ISSUER:gms}

# The platform administrator account is created only when explicitly requested
# with a supplied password (SEC-03, SEC-15 — note the APP_ prefix: the
# `SUPERADMIN_*` names that appear in older notes bind to nothing).
app.superadmin.enabled=${APP_SUPERADMIN_ENABLED:false}
app.superadmin.username=${APP_SUPERADMIN_USERNAME:}
app.superadmin.password=${APP_SUPERADMIN_PASSWORD:}
app.superadmin.email=${APP_SUPERADMIN_EMAIL:}
app.superadmin.full-name=${APP_SUPERADMIN_FULL_NAME:Platform Administrator}

# Login throttling (SEC-09): enforced from the users.account_locked /
# login_attempts columns that have existed in the schema all along.
security.login.max-failed-attempts=${SECURITY_LOGIN_MAX_FAILED_ATTEMPTS:10}

# ── Actuator ─────────────────────────────────────────────────────────────────
# Only the probe groups are anonymous; everything else requires ADMIN/SUPERADMIN
# (SEC-13). `show-details=never` keeps internals out of the public payload.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# ── Mail (optional) ──────────────────────────────────────────────────────────
# Unconfigured mail must never affect startup or health status (OPS-17).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# ── CORS ─────────────────────────────────────────────────────────────────────
# Empty default on purpose: application-dev / application-prod each declare the
# origins appropriate to them, and prod refuses to boot with a localhost origin.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ── Error handling / uploads ─────────────────────────────────────────────────
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
spring.servlet.multipart.enabled=false

# ── Logging ──────────────────────────────────────────────────────────────────
# INFO is the default everywhere; DEBUG is opt-in per environment (OPS-11).
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.gms=${LOG_LEVEL_COM_GMS:INFO}
logging.level.com.gms.config.SuperAdminBootstrapRunner=${LOG_LEVEL_BOOTSTRAP:INFO}
logging.level.com.gms.service.bootstrap.SuperAdminBootstrapService=${LOG_LEVEL_BOOTSTRAP:INFO}
