# Test profile for PostgreSQL-backed integration tests (R4.4, task #62)
# Activated by @ActiveProfiles("test") on integration test classes.
# Uses the existing Docker PostgreSQL container on localhost:5433 with a dedicated test database.

spring.application.name=gms-test

# Allow bean definition overriding for test security config
spring.main.allow-bean-definition-overriding=true

# Database — uses existing Docker PostgreSQL container
spring.datasource.url=jdbc:postgresql://localhost:5433/gms_test
spring.datasource.username=gms_user
spring.datasource.password=gms_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — validate only, never auto-generate schema (ADR-022)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway — run migrations against the test database
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# Security — test-only JWT secret (not used in production)
security.jwt.secret=test-secret-key-for-integration-tests-only-must-be-at-least-256-bits-long
security.jwt.validity-seconds=3600
security.jwt.issuer=gms-test

# Superadmin — disabled for tests but properties must be present for bean creation
app.superadmin.enabled=false
app.superadmin.username=test-admin
app.superadmin.password=test-password-min-8-chars
app.superadmin.email=test-admin@example.com
app.superadmin.full-name=Test Administrator

# Mail — disabled for tests
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.from=

# CORS — test origins (non-localhost to pass StartupSecurityValidator)
cors.allowed-origins=https://test.gms.example.com

# Error handling
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Logging — INFO for tests unless debugging
logging.level.root=WARN
logging.level.com.gms=INFO
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
