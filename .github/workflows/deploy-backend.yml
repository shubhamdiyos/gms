name: Deploy gms_backend to EC2

on:
  push:
    branches:
      - master
    paths:
      # Deployment is for deployables. Documentation, the memory-bank notes and
      # CI workflow edits must not be able to push a release: merging PR #9 ran
      # this workflow twice because `gms_backend/**` also matched
      # gms_backend/memory-bank/*.md.
      - 'gms_backend/src/**'
      - 'gms_backend/pom.xml'
      - 'gms_backend/Dockerfile'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Host-key verification is mandatory (mandate §25.8); the known_hosts file is
      # written by the "Pin SSH host key" step from the EC2_SSH_KNOWN_HOSTS secret.
      SSH_OPTS: -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/runner/.ssh/known_hosts -o ConnectTimeout=10
    concurrency:
      group: deploy-backend
      cancel-in-progress: true
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Pin SSH host key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EC2_SSH_KNOWN_HOSTS:-}" ]]; then
            echo "::error::secret EC2_SSH_KNOWN_HOSTS is not set. Add the line produced by" \
                 "'ssh-keygen -t ed25519 -F <host>' or 'ssh-keyscan <host> | ssh-keygen -lf -'," \
                 "verified out of band. Deploy is refused rather than run with host-key checking" \
                 "disabled (mandate §25.8)."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts >/dev/null
          echo "Pinned $(wc -l < ~/.ssh/known_hosts) known host key(s)."

      - name: Show config (sanitized)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        shell: bash
        run: |
          set -euxo pipefail
          echo "EC2_USER set"
          echo "EC2_HOST: ${EC2_HOST:0:10}... (masked)"

      - name: Verify SSH connectivity
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        shell: bash
        run: |
          set -euxo pipefail
          for i in {1..3}; do
            if ssh $SSH_OPTS "$EC2_USER@$EC2_HOST" 'echo connected'; then
              break
            fi
            echo "SSH attempt $i failed; retrying in 5s" && sleep 5
          done

      - name: Deploy backend on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        shell: bash
        run: |
          set -euxo pipefail
          ssh $SSH_OPTS "$EC2_USER@$EC2_HOST" 'test -f ~/deploy_backend.sh && bash ~/deploy_backend.sh'

      - name: Post-deploy health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        shell: bash
        run: |
          set -euxo pipefail
          for i in {1..10}; do
            status=$(curl -sS --max-time 5 -o /dev/null -w "%{http_code}" "http://$EC2_HOST:8080/api/v1/ping" || true)
            if [[ "$status" == "200" ]]; then
              echo "Health check passed (200)"
              exit 0
            fi
            echo "Ping returned $status; retry $i/10" && sleep 3
          done
          echo "Health check failed"
          exit 1

      - name: Show Docker status (diagnostic)
        if: always()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        shell: bash
        run: |
          set -euxo pipefail
          ssh $SSH_OPTS "$EC2_USER@$EC2_HOST" 'docker ps -a || true'
