name: CI

# Gates every change before it can reach `master`. Runs on GitHub-hosted
# ubuntu-latest only — no paid runners, no cloud services, no managed databases
# (third mandate §20 and the founder's standing zero-unexpected-cost rule).
# Documentation-only changes do not start a build; a change to `.github/**` is
# checked by `validate-workflows.yml` instead. `infra/**/*.md` needs its own
# line because `*.md` matches only root-level markdown: PR #20 changed `docs/**`
# files plus `infra/oci/README.md` and nothing else, and that one nested prose
# file started all three jobs twice — 140 seconds of runner time.
#
# What this workflow is FOR, since Stage 3: the six `*ArchTest` classes are the merge gate for
# `C-3`, `C-4`, `C-5` and `C-7`. They assert declarations — that every repository read carries the
# tenant, that no service takes `schoolId` back as a parameter, that every mutating handler is
# annotated — and two steps in the `backend` job prove that those declarations are actually *checked*:
# `Tenancy arch gates executed` holds the six classes by name (a renamed, excluded, emptied or disabled
# rule class would otherwise leave `mvn verify` green), and `No test class is silently skipped`
# enumerates the whole test tree against surefire's discovery patterns, including the `*IT` shape that
# needs a failsafe binding `pom.xml` does not yet have.
# Behaviour over HTTP (a second tenant reading the first one's rows and getting refused) is proved by
# `live-tenancy` at the bottom of this file: it boots the jar this job uploads against a PostgreSQL of
# its own and runs the nine live steps against that one boot. The `postgres` service above exists for
# the statement-count guard and boots an empty cluster; `Verify scripts syntax and presence` checks the
# same suites statically on every pull request, so a suite that cannot parse is caught before a live
# job spends a runner minute on it.
# What none of the above can see is a browser. `Playwright e2e` is the sixth job and the only one with
# a real Chromium in it: it drives the built bundle against the same jar, for the mandate's clause
# "no browser-console errors on the core journey", which is observable only from inside a browser and
# is not asserted anywhere else in this repository.

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'infra/**/*.md'
      - 'gms_backend/memory-bank/**'
      - '.github/**'
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'infra/**/*.md'
      - 'gms_backend/memory-bank/**'
      - '.github/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # `SqlStatementCountPerRequestTest` counts the SQL statements one real HTTP request prepares, so
      # the build now has a PostgreSQL to prepare them against. The owner took this decision on
      # 2026-11-02; the reasoning that made it cheap is in the guard step of `validate-workflows.yml`
      # that authorises `image:` inside a `services:` block and nowhere else.
      #
      # Loopback only: `ports:` publishes to the runner's own 127.0.0.1, to nothing outside the job, and
      # the container dies with the job. The database it holds is created by the test itself
      # (`gms_n_plus_1`), seeded with rows invented by the same test, and never contains real data.
      # `postgres:15` is the major the operator's own server runs (Homebrew 15.8 on the machine that
      # produced every Stage 5 number); `DoD-2` names 17, and moving the major is an owner decision, not
      # a quiet edit here.
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ci_user
          # Not a credential. `ci_user` owns an ephemeral database that exists for the length of this job
          # on a loopback interface inside a throwaway VM, and nothing in the repository can reach it
          # afterwards. A reference to a repository secret here would be worse, not better: an unset secret
          # expands to the empty string and PostgreSQL 15 refuses to initialise without a password.
          POSTGRES_PASSWORD: ci_password
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --name gms-ci-db
          --health-cmd "pg_isready -U ci_user -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The test's own override knobs. `GMS_N1_DB_URL` is the JDBC URL it must be allowed to create and
      # use, and the class refuses any URL whose database path is not exactly `gms_n_plus_1` — so this
      # line cannot point the suite at a database it does not own.
      GMS_N1_DB_URL: jdbc:postgresql://127.0.0.1:5432/gms_n_plus_1
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_password
      # The PostgreSQL-backed integration tests (BasePostgresIntegrationTest subclasses and
      # PasswordChangeEnforcementFilterTest) read these through application-test.properties. They exist
      # because those tests used to point at a developer's `localhost:5433/gms_test`, a port the runner
      # never has — 36 errors on the first PR that added the classes. The database is created by the
      # step below in the same throwaway sidecar, so the suite runs against a real PostgreSQL instead of
      # being skipped.
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/gms_test
      TEST_DB_USERNAME: ci_user
      TEST_DB_PASSWORD: ci_password
    defaults:
      run:
        working-directory: gms_backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'                     # the project targets 21; JDK 24 breaks Lombok
          cache: maven

      - name: Create the integration-test database
        # The sidecar above initialises one database (`postgres`). The profile-driven integration tests
        # need their own, and `application-test.properties` names it `gms_test` (through TEST_DB_URL).
        # `docker exec` uses the container's own psql, so this step adds no runner package to depend on
        # and no network surface: the database lives inside the same throwaway container the health check
        # already watches. `CREATE DATABASE` fails if it already exists, which would mean the service was
        # not fresh — the correct outcome for a gate that should only ever measure a clean cluster.
        run: docker exec gms-ci-db psql -U ci_user -d postgres -c 'CREATE DATABASE gms_test'

      - name: Compile, test and package
        # `clean` is not decoration. The roadmap records a schema run that "logged no Flyway line at
        # all" because the jar had been built before the `pom.xml` edit: without `clean`, `package`
        # reuses a stale artifact and reports success. `clean verify` on a fresh checkout is also what
        # PRODUCTION_READINESS_MATRIX measures ("`mvn -B verify`"), so the local command and the gate
        # now run the same thing. `-B` stays for batch output, and the Maven warm cache from
        # `actions/setup-java` above is the cache-friendly half — no `-o`, because the cache holds
        # dependencies, not a complete offline repository, and offline mode would fail resolution.
        run: mvn -B clean verify

      - name: Tenancy arch gates executed
        # The arch tests are the CI gate, so their execution is asserted rather than assumed. All six
        # classes end in `ArchTest`, which surefire's default include patterns (`**/Test*.java`,
        # `**/*Test.java`, `**/*Tests.java`, `**/*TestCase.java`) already discover — verified against
        # target/surefire-reports on this branch, where each of the six writes its own report. That is
        # why there is no `<includes>` block to add and no duplicate test: the naming is fine, and the
        # real risk is that the naming stops being true. Three controls, run 2026-11-02 against doctored
        # copies of target/surefire-reports, each returned exit 1 naming its class: a report deleted (the
        # renamed-class or `<excludes>` case), `tests="0"` (the emptied-class case), and `skipped="1"`
        # (the `@Disabled` case). Without this step all three leave the job green.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          REQUIRED = (
              "com.gms.repository.RepositoryTenantScopeArchTest",
              "com.gms.repository.TenantScopedReadArchTest",
              "com.gms.model.entity.EntityLazyAccessorArchTest",
              "com.gms.model.entity.EntityTenantColumnArchTest",
              "com.gms.security.DenyByDefaultAuthorizationArchTest",
              "com.gms.security.TenantParameterArchTest",
          )

          reports = {}
          for path in glob.glob("target/surefire-reports/TEST-*.xml"):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as exc:
                  print(f"::error::unreadable surefire report {path}: {exc}")
                  sys.exit(1)
              reports[root.get("name")] = root

          bad, executed, methods = [], 0, 0
          for cls in REQUIRED:
              suite = reports.get(cls)
              if suite is None:
                  bad.append(f"{cls}: no surefire report - the class did not execute "
                             f"(renamed away from *Test, excluded, disabled or deleted)")
                  continue
              n = int(suite.get("tests") or 0)
              sk = int(suite.get("skipped") or 0)
              fa = int(suite.get("failures") or 0)
              er = int(suite.get("errors") or 0)
              executed += 1
              methods += n
              print(f"ok   {cls}: tests={n} skipped={sk} failures={fa} errors={er}")
              if n == 0:
                  bad.append(f"{cls}: produced a report with zero tests - its assertions were "
                             f"removed or its method names stopped matching the JUnit pattern")
              if sk:
                  bad.append(f"{cls}: {sk} test(s) skipped - a disabled architecture rule is an "
                             f"unguarded rule")
              if fa or er:
                  bad.append(f"{cls}: {fa} failure(s) and {er} error(s)")

          if bad:
              for message in bad:
                  print(f"::error::{message}")
              sys.exit(1)
          print(f"tenancy arch gate: {executed}/{len(REQUIRED)} classes, {methods} rules executed")
          PY

      - name: No test class is silently skipped
        # The six-class gate above names the tenancy contract, so it cannot see the seventh rule class
        # nobody has written yet, or the one a future edit renames. `mvn -B clean verify` is green in
        # both of those cases and in four more, all of which are surefire's business rather than the
        # build's: surefire discovers `**/Test*.java`, `**/*Test.java`, `**/*Tests.java`,
        # `**/*TestCase.java` and nothing else, and it never touches `**/*IT.java` unless
        # `maven-failsafe-plugin` is bound in `pom.xml` — which it is not, so Stage 5's criterion 5
        # ("CI runs unit **and** integration jobs") has a silent-skip shape already: an `*IT` class
        # added tomorrow compiles, runs nowhere, and reports success.
        #
        # This step enumerates the source tree instead of trusting the naming: every test source that
        # declares a JUnit member must (a) carry a name surefire discovers, and (b) appear in
        # `target/surefire-reports` with at least one test executed and none skipped. It asks nothing of
        # a source file and duplicates no assertion: when it goes red the fix is build configuration —
        # an `<include>` for the class, or binding failsafe to the `verify` phase — and the message
        # says which. The abstract-base exemption is not a loophole: a base class has no test of its
        # own, and its concrete subclasses are each enumerated in full. A `@Nested` class is likewise
        # not a skip: its tests run under `Outer$Inner` reports, so `class_tally` sums the family and a
        # nested class with no tests of its own still reports zero.
        #
        # Run 2026-11-02 against `mvn -B clean verify` on JDK 21: 16 classes, 104 tests, 0 skipped,
        # step green. Four controls against doctored copies of that same output, each exit 1 naming the
        # class: the class and file renamed `TenantParameterArchCheck` (the include-pattern message),
        # its report deleted (the `<excludes>` case), `tests="0"` (the emptied case), and a
        # `StudentTenantIsolationIT` source with no failsafe bound. A fifth control — an
        # `abstract class AbstractLiveProbeTest` — stayed silent, as designed.
        #
        # PR #33 found the gap the 2026-11-02 controls could not: `ProductionSecurityIntegrationTest`
        # holds all of its tests in `@Nested` classes, so surefire writes `Outer` with `tests="0"` and
        # `Outer$CsrfProtection` and friends with the real counts. The guard read only the outer report
        # and refused a class that had in fact run — 352 tests executed, one name reported as empty. The
        # emptied-class control is still honoured, because zero children plus the disabled ones would
        # only ever add to zero.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, sys
          import xml.etree.ElementTree as ET

          # One top-level type per file, its modifiers captured so an abstract base can be recognised
          # without grepping the whole text for the word -- a comment that mentions `abstract` must not
          # be able to hide a real rule class.
          DECL = re.compile(r"^[ \t]*((?:(?:public|private|final|abstract|sealed|strictfp|static)[ \t]+)*)"
                            r"(?:class|interface|enum|record)[ \t]+([A-Za-z_$][\w$]*)", re.M)
          MEMBER = re.compile(r"^[ \t]*@(?:Test|ArchTest|TestFactory|ParameterizedTest|RepeatedTest|Nested)\b", re.M)
          PKG = re.compile(r"^[ \t]*package[ \t]+([\w.]+)[ \t]*;", re.M)
          FAILSAFE_NAME = re.compile(r"(IT|ITest|ITCase)$")

          def parse(dirglob):
              out = {}
              for path in glob.glob(dirglob):
                  try:
                      root = ET.parse(path).getroot()
                  except ET.ParseError as exc:
                      print(f"::error::unreadable report {path}: {exc}")
                      sys.exit(1)
                  out[root.get("name")] = root
              return out

          reports = parse("target/surefire-reports/TEST-*.xml")
          fs_reports = parse("target/failsafe-reports/TEST-*.xml")
          with open("pom.xml", encoding="utf-8") as fh:
              failsafe_bound = "maven-failsafe-plugin" in fh.read()

          def discovered(simple):
              return simple.startswith("Test") or simple.endswith(("Test", "Tests", "TestCase"))

          def tally(suite):
              return (int(suite.get("tests") or 0), int(suite.get("skipped") or 0),
                      int(suite.get("failures") or 0), int(suite.get("errors") or 0))

          def class_tally(fqcn):
              # `@Nested` classes run under their own names (`Outer$Inner`) and write their own reports,
              # while surefire also writes an `Outer` report whose `tests` attribute is 0 because every
              # test lives one level down. Counting the outer report alone would refuse a class that did
              # run — the shape PR #33 first hit, on `ProductionSecurityIntegrationTest`. The children are
              # folded in here, and never counted twice: the source loop below enumerates one top-level
              # type per file, so a nested class is not visited on its own.
              n = sk = fa = er = 0
              prefix = fqcn + "$"
              for name, suite in reports.items():
                  if name == fqcn or name.startswith(prefix):
                      cn, csk, cfa, cer = tally(suite)
                      n, sk, fa, er = n + cn, sk + csk, fa + cfa, er + cer
              return n, sk, fa, er

          bad, checked, executed, skipped = [], 0, 0, 0
          for path in sorted(glob.glob("src/test/java/**/*.java", recursive=True)):
              with open(path, encoding="utf-8") as fh:
                  text = fh.read()
              if not MEMBER.search(text):
                  continue
              decl = DECL.search(text)
              if decl is None:
                  bad.append(f"{path}: declares a JUnit member but no top-level type - there is no "
                             f"class for surefire to load")
                  continue
              modifiers, simple = decl.group(1), decl.group(2)
              if "abstract" in modifiers:
                  continue
              pkg = PKG.search(text)
              fqcn = (pkg.group(1) + "." if pkg else "") + simple
              checked += 1

              if FAILSAFE_NAME.search(simple):
                  if not failsafe_bound:
                      bad.append(f"{path}: `{simple}` is named for failsafe, but maven-failsafe-plugin "
                                 f"is not bound in pom.xml. Surefire ignores this pattern, so `mvn "
                                 f"-B clean verify` stays green with the job unrun: bind failsafe to the "
                                 f"verify phase (Stage 5 criterion 5) or give the class a surefire name.")
                  else:
                      suite = fs_reports.get(fqcn)
                      if suite is None:
                          bad.append(f"{path}: no failsafe report for {fqcn} - the integration job did "
                                     f"not run")
                      else:
                          n, sk, fa, er = tally(suite)
                          executed += n
                          skipped += sk
                          if n == 0 or sk or fa or er:
                              bad.append(f"{fqcn} (failsafe): tests={n} skipped={sk} failures={fa} "
                                         f"errors={er}")
                  continue

              if not discovered(simple):
                  bad.append(f"{path}: `{simple}` matches none of surefire's default include patterns "
                             f"(**/Test*.java, **/*Test.java, **/*Tests.java, **/*TestCase.java), so it "
                             f"is compiled and never run. Fix it in the build - add an <include> for it "
                             f"to surefire - rather than copying its assertions into a class surefire "
                             f"does see.")
                  continue
              suite = reports.get(fqcn)
              if suite is None:
                  bad.append(f"{fqcn}: named so surefire would discover it, yet it produced no report - "
                             f"it did not execute (excluded, disabled, emptied, or its package does not "
                             f"match its directory)")
                  continue
              n, sk, fa, er = class_tally(fqcn)
              executed += n
              skipped += sk
              if n == 0:
                  bad.append(f"{fqcn}: produced a report with zero tests")
              if sk:
                  bad.append(f"{fqcn}: {sk} test(s) skipped - a disabled rule is an unguarded rule")
              if fa or er:
                  bad.append(f"{fqcn}: {fa} failure(s) and {er} error(s)")

          if bad:
              for message in bad:
                  print(f"::error::{message}")
              sys.exit(1)
          print(f"discovery gate: {checked} test classes declared, {executed} tests executed, "
                f"{skipped} skipped")
          PY

      - name: Upload jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gms-backend-jar
          path: gms_backend/target/*.jar
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-coverage
          path: gms_backend/target/site/jacoco
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gms_frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gms_frontend/package-lock.json

      - run: npm ci

      - name: Lint
        # Re-measured on 2026-11-02 against this branch: 16 to 18 errors across 6 to 7 files, 0
        # warnings, and the count moved between two runs an hour apart because the dashboard-wiring PR
        # is editing those files right now. So the gate is NOT a total — a hardcoded ceiling would fail
        # this run for somebody else's debt. It is a rule scope: an undefined identifier anywhere under
        # `src/`, or a fatal parse error anywhere at all, fails the job. That is the class of mistake
        # the `WC` icon import this session produced, and the `no-undef` hits left outside the gate are
        # the two dead `api/[...path].js` proxies from SEC-14, which return to it when those files go.
        #
        # There is deliberately no continue-on-error on this step. The previous version of it swallowed
        # every lint failure behind a downgrade justified by a 47-error baseline; a step that cannot
        # fail is not a gate, and `Workflow validation` now refuses the key outright.
        run: |
          set -euo pipefail
          json="$RUNNER_TEMP/eslint.json"
          # The repo's own script (`eslint .`), asked for JSON. eslint exits 1 when it merely finds
          # lint errors -- including the debt this step does not gate on -- so its status is captured
          # here and the verdict is computed from the JSON below rather than from the exit code of a
          # command. Anything *other* than 0 or 1 is eslint failing to run at all (a broken config, a
          # missing plugin: exit 2), and that fails the step on its own rather than being swallowed.
          # There is no `|| true` on this line: the standing rule is that no failing command may be
          # neutralised in place, and `Workflow validation` now refuses the statement-level form.
          # Four controls run 2026-11-02 against this step, each exit 1: a `no-undef` planted at
          # `src/pages/Dashboard.jsx:41` (the exact `WC` icon shape), a fatal parse error outside `src/`,
          # an empty `[]` result set (linted nothing), and a stubbed `npm` that exits 2 (did not lint).
          # Against the real tree the step is green: 16 errors / 0 warnings, 0 in the gated classes.
          rc=0
          npm run --silent lint -- --format json > "$json" || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::eslint exited $rc, not 0 (clean) or 1 (findings reported): it failed to run at all, so there is no verdict to compute. A broken eslint.config.js must not be allowed to look like a green lint."
            exit 1
          fi
          python3 - "$json" <<'PY'
          import json, os, sys

          BLOCKING = {"no-undef"}
          root = os.getcwd() + os.sep
          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  reports = json.load(fh)
          except Exception as exc:
              print(f"::error::eslint produced no parsable JSON ({exc}); a lint step that cannot "
                    f"read its own output cannot be trusted, so it fails")
              sys.exit(1)

          if not reports:
              print("::error::eslint reported on zero files - the run linted nothing, which is not a "
                    "clean frontend but an empty scan")
              sys.exit(1)

          offences, errors, warnings, dirty = [], 0, 0, 0
          for report in reports:
              path = report.get("filePath", "")
              rel = path[len(root):] if path.startswith(root) else path
              errors += report.get("errorCount", 0)
              warnings += report.get("warningCount", 0)
              if report.get("errorCount", 0) or report.get("warningCount", 0):
                  dirty += 1
              for message in report.get("messages", []):
                  if message.get("severity") != 2:
                      continue
                  rule = message.get("ruleId")
                  fatal = bool(message.get("fatal"))
                  if (rule in BLOCKING and rel.startswith("src/")) or fatal:
                      offences.append((f"{rel}:{message.get('line')} {rule or 'fatal parse error'}",
                                       "an identifier used but never imported or declared throws in the "
                                       "browser at runtime" if rule else
                                       "the file does not parse, so nothing downstream of it is shipped"))

          line = (f"frontend lint: {errors} error(s) / {warnings} warning(s) across {dirty} file(s); "
                  f"{len(offences)} in the gated classes (`no-undef` under `src/`, any fatal parse error)")
          print(line)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(line + "\n")
                  for offence, _reason in offences:
                      fh.write(f"- {offence}\n")

          if offences:
              for offence, reason in offences:
                  print(f"::error::{offence} - {reason}")
              sys.exit(1)
          PY

      - name: Frontend unit tests
        # The step this workflow used to run was `npm test -- --run` with continue-on-error, against a
        # `package.json` that had no `test` script — measured 2026-11-02 when this was written: the
        # script set was dev/build/lint/preview. So it failed every run and the failure was discarded,
        # which reads as a passing "Unit tests" check while nothing was tested.
        #
        # It used to tolerate that absence and say so in the summary, because the tests had not been
        # written yet. They have: `a20239c` on this branch added `"test": "vitest run"` and two suites,
        # and Stage 4 criterion 5 now claims a frontend test count above zero as **met**. A criterion
        # that is met has to be *held* met, so the absence of the script or of a test file is a red step
        # from here on — the same reasoning that made this workflow refuse a `skipped` count above zero
        # in the backend's discovery step. Deleting the suite was always going to be visible; it should
        # not also be cheap.
        #
        # `--run` is kept, and it is not redundant: `test` is `vitest run` today, so the command would
        # work without it, but a step that inherits whatever mode the script happens to declare can hang
        # a runner for the whole job timeout. The flag makes non-watch a property of CI rather than of
        # package.json.
        #
        # `--watchAll=false` was the argument that made this step red on PR #26 and it is gone: that is
        # a Jest flag, and Vitest's parser refuses unknown options outright —
        # `CACError: Unknown option \`--watchAll\`` — so the run died on its own command line before a
        # single test executed. Worth recording because the defect was in the invocation, not in a test,
        # and from outside the two look identical: a red gate either way. Measured after the change with
        # the same command line, on node 24.22.0 / npm 11.19.1 / vitest 5.0.5: `Test Files 2 passed (2)`,
        # `Tests 9 passed (9)`, exit 0. That is not this job's environment — `setup-node` pins 22 here —
        # so the local run proves the flags parse and the suite passes, and only the CI run proves it on
        # the shipped Node.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os, sys

          scripts = json.load(open("package.json")).get("scripts", {})
          files = sorted(glob.glob("src/**/*.test.*", recursive=True))
          if "test" not in scripts:
              print("::error::gms_frontend/package.json declares no `test` script, so zero frontend "
                    "unit tests can run. Stage 4 criterion 5 is a frontend test count above zero and "
                    "Stage 5 recorded it as met at 9 tests — a step that notices this and passes is the "
                    "green-while-untested shape this workflow was rewritten to refuse.")
              sys.exit(1)
          if not files:
              print("::error::the `test` script is present but no `src/**/*.test.*` file is, so "
                    "`npm test` would exit 0 having collected nothing")
              sys.exit(1)
          print(f"frontend unit tests: {scripts['test']} over {len(files)} file(s): "
                f"{', '.join(os.path.basename(f) for f in files)}")
          PY
          npm test -- --run

      - name: Production build
        # The blocking step. Vite/Rollup resolves every import and every named export at build time,
        # which is precisely what catches a bad icon import before it reaches a browser.
        run: npm run build

  verification_scripts:
    name: Verify scripts syntax and presence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The cheap static half of the live suite, runnable with no database and no backend.
    #
    # `scripts/verify-mvp-e2e.sh` and `scripts/verify-perf-50k.sh` are being written on another branch
    # of this same effort, and were still untracked when this job was added. Two rules meet here: a gate
    # must never reference a path that may be missing (the run would go red for the wrong reason), and a
    # missing verification suite must never be reported as proved. So nothing below names those files in
    # a command line: the steps glob the tree, and the presence of each live suite is *reported*, not
    # asserted. Absent today means "not in the tree, nothing claimed"; present means the two hard checks
    # below bind it immediately, on the same commit that adds it — a truncated heredoc from a parallel
    # edit (`bash -n`) or a script committed at mode 644 while its own header documents running it as
    # `./scripts/verify-mvp-e2e.sh` (`os.X_OK`) fail this job, and only this job, at merge time.
    #
    # GitHub cannot skip a whole job on the contents of the tree — `jobs.<id>.if` is evaluated before
    # `actions/checkout` — which is why the absence handling is a glob plus a report rather than an
    # `if:`. The job that runs these suites for real is `live-tenancy` at the bottom of this file; it
    # calls `scripts/ci-live-tenancy.sh`, which refuses the run when a suite is missing from its own
    # list rather than stepping over it. So a suite that exists but does not parse dies here, in five
    # minutes and without a database, instead of costing a live job a boot to say the same thing — and
    # the glob is over `scripts/**/*.sh`, so it covers `scripts/ci-playwright-e2e.sh`, the harness the
    # sixth job `Playwright e2e` calls, exactly the same way: a truncated heredoc from a parallel edit
    # there is caught here too, before that job spends a boot and a chromium download on it.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Every script in the tree parses and is executable as documented
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, subprocess, sys

          # The suites that assert behaviour over HTTP, and the seed the perf suite measures against.
          # Listed for reporting only: none of these paths is opened, executed or required.
          LIVE_SUITES = [
              "scripts/verify-c1-tenancy.sh",
              "scripts/verify-c2-tenant-context.sh",
              "scripts/verify-c3-scoped-reads.sh",
              "scripts/verify-c4-owned-reads.sh",
              "scripts/verify-c7-tenant-key.sh",
              "scripts/verify-mvp-e2e.sh",
              "scripts/verify-perf-50k.sh",
              "scripts/verify-security.sh",
              "scripts/verify-schema.sh",
              "scripts/seed/perf_seed_50k.sql",
          ]

          shell_files = sorted(glob.glob("scripts/**/*.sh", recursive=True))
          bad, rows = [], []
          for path in shell_files:
              parsed = subprocess.run(["bash", "-n", path], capture_output=True, text=True)
              if parsed.returncode != 0:
                  detail = parsed.stderr.strip() or "no stderr"
                  bad.append(f"{path}: `bash -n` exit {parsed.returncode} - {detail}; the script "
                             f"cannot run at all, so no live job can trust it")
                  continue
              if os.path.basename(path).startswith("verify-") and not os.access(path, os.X_OK):
                  # Every live suite's own header tells the operator to run it as `./scripts/<name>.sh`.
                  # Git carries the mode bit, so a 644 commit is a mistake this check can see.
                  bad.append(f"{path}: present but not executable, while its header documents "
                             f"`./{path}` - chmod +x it before it lands, or the live job dies on "
                             f"`Permission denied` rather than on a failed assertion")
                  continue
              rows.append(f"ok   {path}")

          present = [p for p in LIVE_SUITES if os.path.exists(p)]
          absent = [p for p in LIVE_SUITES if p not in present]

          for line in rows:
              print(line)
          print(f"syntax/mode gate: {len(rows)} of {len(shell_files)} shell script(s) in scripts/ pass")
          for path in absent:
              print(f"absent  {path} - not in this tree, so CI claims nothing about it")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(f"Live verification suites in the tree: {len(present)}/{len(LIVE_SUITES)}\n")
              for path in absent:
                  fh.write(f"- `{path}` ABSENT (being written elsewhere; nothing is claimed for it)\n")
              fh.write("\nCI runs the **syntax and mode** half of these scripts. Their assertions are "
                       "HTTP calls and SQL against a running backend, which `live-tenancy` boots on "
                       "every pull request that is not documentation-only.\n")

          if bad:
              for message in bad:
                  print(f"::error::{message}")
              sys.exit(1)
          PY

  infrastructure:
    name: Infrastructure definitions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Same version as the tool of record on the operator's machine, and the
      # same version whose SHA-256 is recorded in infra/oci/README.md. Upgrading
      # it is a deliberate edit in two places, not a moving tag.
      TOFU_VERSION: '1.13.2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No third-party OpenTofu action is used, so this adds nothing to pin and
      # nothing to the supply chain: two downloads, and the archive is only
      # unpacked after its digest matches the publisher's own SHA256SUMS.
      - name: Install OpenTofu, checksum-verified
        run: |
          set -euo pipefail
          v="$TOFU_VERSION"
          base="https://github.com/opentofu/opentofu/releases/download/v${v}"
          curl -fsSL -o "/tmp/tofu_${v}_linux_amd64.zip" "${base}/tofu_${v}_linux_amd64.zip"
          curl -fsSL -o /tmp/sums.txt "${base}/tofu_${v}_SHA256SUMS"
          grep "tofu_${v}_linux_amd64.zip\$" /tmp/sums.txt > /tmp/only.sum
          ( cd /tmp && sha256sum --strict --check only.sum )
          unzip -q -o "/tmp/tofu_${v}_linux_amd64.zip" tofu -d /usr/local/bin
          tofu version

      - name: Formatting is canonical
        run: tofu fmt -check -recursive infra/oci

      - name: Init without a backend
        run: tofu -chdir=infra/oci init -backend=false -input=false

      - name: Validate
        run: tofu -chdir=infra/oci validate

      # This is the step that earns its place. `tofu validate` does NOT evaluate
      # variable validation blocks — measured on 2026-11-01: all seven invalid
      # values below return exit 0 and "Success! The configuration is valid" from
      # validate, and only `tofu plan` raises them. Plan also fails here on the
      # missing ~/.oci/config, which is exactly right: the validation error is
      # reported alongside it, not after it, so the guards are testable with no
      # credentials and no cloud call. Deleting a validation block therefore
      # breaks this job instead of quietly removing a production safety rule.
      - name: Every plan-time guard still refuses the dangerous value
        run: |
          set -uo pipefail
          # All three required variables are set here even when a check is about a different one.
          # Without ssh_source_cidr the plan aborts on "No value for required variable" *before*
          # validation runs, so six of the seven checks pass their tofu invocation and then report
          # the guard as missing. That is how this step failed on its first real run, and it is the
          # reason the suite is self-contained instead of relying on a terraform.tfvars that CI has
          # never seen.
          base=(-var="compartment_ocid=ocid1.compartment.oc1..caplaceholder"
                -var="ssh_public_key_path=/tmp/ci_gms.pub"
                -var="ssh_source_cidr=203.0.113.7/32")
          fails=0
          # The output is captured before it is matched, on purpose. `tofu plan … | grep -q` under
          # `pipefail` inverts this step: grep exits the instant it matches, tofu takes SIGPIPE with
          # status 141, the pipeline is non-zero, and all seven guards read as broken while every one
          # of them is firing. That bug was in the first version of this step and cost an hour.
          check() {
            local label="$1" badvar="$2" out
            out=$(tofu -chdir=infra/oci plan -input=false "${base[@]}" -var="$badvar" 2>&1 || true)
            case "$out" in
              *"Invalid value for variable"*)
                echo "ok   ${label}" ;;
              *)
                echo "::error::${label}: no validation error was raised. The guard is missing, mis-typed, or was deleted."
                printf '%s\n' "$out" | tail -20
                fails=1 ;;
            esac
          }
          check "broad SSH source 0.0.0.0/0"     "ssh_source_cidr=0.0.0.0/0"
          check "SSH prefix wider than /32"      "ssh_source_cidr=203.0.113.0/24"
          check "private key instead of .pub"    "ssh_public_key_path=/home/runner/.ssh/id_rsa"
          check "compartment that is not an OCID" "compartment_ocid=tenancy-abc"
          check "deploy_user=root"               "deploy_user=root"
          check "shape_ocpus above the allowance" "shape_ocpus=8"
          check "boot volume above the allowance" "boot_volume_size_gb=400"
          exit "$fails"

      # §9.2's port rules are the reason the security list exists, and the
      # failure mode is a future edit adding one ingress rule "temporarily".
      - name: Forbidden ports are not published
        run: |
          set -euo pipefail
          if grep -nE 'min[[:space:]]*=[[:space:]]*(5432|8080|3000)|max[[:space:]]*=[[:space:]]*(5432|8080|3000)' \
               infra/oci/network.tf; then
            echo "::error::network.tf publishes a port §9.2 forbids (5432, 8080, 3000)"
            exit 1
          fi
          if ! grep -q 'local.shape' infra/oci/compute.tf || ! grep -q 'VM.Standard.A1.Flex' infra/oci/data.tf; then
            echo "::error::the instance shape is no longer the Always Free ARM shape fixed in data.tf — paid shapes are excluded by construction, not by default"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # LIVE TENANCY — the behaviour half of Stage 3: eight suites and one fixture step driving
  # a RUNNING backend over HTTP with real JWTs, plus their SQL halves against the same database.
  # This job replaced a disabled stub on 2026-11-02 and is a gate: its name is in
  # `gate-coverage.yml`'s GATES map and in `validate-workflows.yml`'s required-context
  # list. That is how a job becomes blocking in this repository without a branch-
  # protection edit — `Gate coverage` is the single context protection requires, and it
  # refuses any pull request whose owed gate is missing or red.
  #
  # What it has measured. Same command on both machines, and the verdicts agree while the clocks do not:
  # on colima at 2 CPU / 4 GiB the application is up in 9 s and the nine steps take 27 s; on this runner
  # (run `41488389433`, the green one) it is 18 s and 34 s, inside a job that spends 82 s end to end
  # including checkout, the artifact download, setup-java and the `postgres:15` pull. Both runs: 626
  # assertions passing, 0 failed, 17 skipped and all seventeen inside `verify-c4-owned-reads.sh`'s
  # documented ceiling. The run before this one (`41485021174`) was red, and the runner is what made it
  # red — two defects a macOS laptop cannot see. This job died at 87 s because `p1_fixtures.sh` asked
  # `date -v-3d` for a date, a BSD flag the runner answers with an empty stdout, which became
  # `date = ''` in SQL and killed the fixture and the suite that reads its handoff file. `Lint every
  # workflow` died at 43 s because this job's jar-path message used backticks inside a double-quoted
  # echo, which shellcheck correctly read as command substitution — and `Gate coverage` died with them,
  # refusing rather than passing, which is the behaviour it was written for. The first run of the
  # harness this job wraps, against a jar built from the merged master (`8145a31`), had already found
  # two more defects on the laptop — a retired row answering 403 where its own school expected 404
  # (`RetiredRowReadContractTest`), and two suites locating their tenants by "the lowest school ids",
  # which silently pointed them at another card's tenants once the nine steps shared one database.
  #
  # No repository secret is read here, and none is needed: the database is an empty cluster
  # that exists for the length of the job on the runner's loopback, the tenants are invented
  # by the suites, and every credential is minted per run. An unset secret expands to the
  # empty string, PostgreSQL refuses to initialise without a password, and the job would die
  # on a missing prerequisite instead of on a failed assertion — the reasoning that already
  # put a literal password on the `backend` job's sidecar.
  live-tenancy:
    name: Live tenancy suites
    needs: [backend, verification_scripts]
    runs-on: ubuntu-latest
    # Fifteen minutes for a job that measured 18 s of boot plus 34 s of suites on the runner itself
    # (82 s end to end, run 41488389433) and 9 s plus 27 s on a 2-CPU laptop container. The ceiling is
    # therefore ten times the measurement: it is room for a cold `postgres:15` pull and a slow artifact
    # download, not a guess about the suites. The number is also a promise to `gate-coverage.yml`:
    # `backend`'s 20-minute ceiling plus this one is exactly its 2100-second wait, so a gate that
    # finishes inside its own timeout always finishes inside the watch, and a "no verdict" refusal can
    # only mean a queue or a hang.
    timeout-minutes: 15
    services:
      # `postgres:15` is the major the operator's own server runs, and the same one the
      # `backend` job's sidecar uses. `--name` is not cosmetic: the SQL halves of
      # verify-c2/c3/c4/c7/p1 and verify-security reach the database with
      # `docker exec gms-postgres psql`, which is how they check columns no HTTP response
      # exposes. Published to the runner's own loopback, to nothing outside the job.
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: gms
          POSTGRES_USER: gms_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --name gms-postgres
          --health-cmd "pg_isready -U gms_user -d gms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      GMS_CI_WORK_DIR: ${{ github.workspace }}/live-tenancy-work
      GMS_BASE_URL: http://localhost:8080
      DB_URL: jdbc:postgresql://127.0.0.1:5432/gms
      DB_USERNAME: gms_user
      DB_PASSWORD: ci_password
      GMS_VERIFY_DB: gms
      GMS_PG_CONTAINER: gms-postgres
      GMS_PG_USER: gms_user
      GMS_PG_PASSWORD_ENV: DB_PASSWORD
      # The platform account the harness boots and the suites log in as, and the two role
      # passwords that retire the skips: without a teacher password `verify-mvp-e2e.sh`
      # skips three least-privilege refusals, and the harness's ceiling for it is zero.
      GMS_SUPERADMIN_USERNAME: ciplatformadmin
      GMS_SUPERADMIN_PASSWORD: Platform_Verify_2026!
      GMS_TEACHER_PASSWORD: Teacher_Verify_2026!
      GMS_STAFF_PASSWORD: Staff_Verify_2026!
      # The school codes `verify-mvp-e2e.sh` creates and `p1_fixtures.sh` then locates by
      # code. Named here so a run is reproducible rather than dependent on whoever last
      # edited a default.
      GMS_SCHOOL_A_CODE: MVP801
      GMS_SCHOOL_B_CODE: MVP802
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch the jar the backend job built
        # The same artifact `mvn -B clean verify` produced, so the application this gate
        # exercises is the one the unit and arch tests passed — not a second build that
        # could differ from it.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gms-backend-jar
          path: live-tenancy-jar

      - name: Where the jar landed
        # The artifact's internal layout is `upload-artifact`'s decision — it strips the path up to the
        # common parent of the matched files — so the name is resolved here rather than assumed by a
        # literal that would fail with "no jar at …" on the day the build changes its name.
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(live-tenancy-jar/*.jar)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "FATAL: expected exactly one jar in live-tenancy-jar/, found ${#jars[@]}."
            echo "       The backend job uploads gms_backend/target/*.jar; more than one means the"
            echo "       build now produces two artifacts and this gate cannot say which it booted."
            exit 1
          fi
          echo "GMS_JAR=${jars[0]}" >> "$GITHUB_ENV"
          echo "will boot ${jars[0]}"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Boot the application and run the nine live steps
        # One command, and the same command an operator types on a laptop:
        # `scripts/ci-live-tenancy.sh` owns the boot, the wait on /actuator/health/readiness,
        # the suite list, the per-suite skip ceilings and the teardown. It boots with no
        # profile, so `StartupSecurityValidator` and the Flyway chain are themselves part of
        # what has to pass before any suite runs. Its exit code is this step's.
        run: bash scripts/ci-live-tenancy.sh

      - name: Upload the suite logs
        if: always()
        # Every `FAIL` line the harness printed is in the step output above; the logs are
        # the whole transcripts, which is what a reader needs to tell a defect from an
        # environment that moved.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-tenancy-logs
          path: live-tenancy-work/
          retention-days: 7
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────────
  # PLAYWRIGHT E2E — the browser half of the pyramid, and the sixth job. What it proves that
  # no job above it can: a real Chromium driving the built bundle against a real backend.
  # `backend` asserts declarations and units, `frontend` proves the bundle builds and its pure
  # functions agree, and `live-tenancy` proves behaviour over HTTP with curl and psql — but
  # `verify-mvp-e2e.sh`, the suite that walks the MVP journey, has no browser in it and the Vitest
  # suite has no server behind it. The mandate's clause this job exists to enforce is "no
  # browser-console errors on the core journey", and a console error is observable only from inside
  # a browser: an exception thrown in a React render, a `4xx` the UI swallows silently, a bundle
  # that builds clean and then dies on first navigation. Every one of those is green everywhere else
  # in CI and fatal to the administrator who logs in. `gms_frontend/e2e/admin-journey.spec.js` walks
  # the journey — rotation, registering a pupil, the roll, a cross-tenant search that must come back
  # empty — and its `console-guard.fixture.js` turns the first console error into a failed test.
  #
  # It builds nothing itself and downloads the `backend` job's jar for the same reason
  # `live-tenancy` does, stated on that job: the application this gate exercises has to be the one
  # the unit and arch tests passed, not a second build that could differ from it. A second
  # `mvn -B clean verify` here would also re-prove a compile that is already proved on this exact
  # commit, for roughly 78 s of runner time the job would rather spend on the browser.
  #
  # Fifteen minutes, and the number is a promise to `gate-coverage.yml`: `backend`'s 20-minute
  # ceiling plus a 15-minute gate is exactly its 2100-second watch, and because this job runs IN
  # PARALLEL with `Live tenancy suites` — both `needs: [backend, verification_scripts]`, neither
  # needing the other — that 2100-second ceiling is unchanged provided this job also finishes inside
  # its own 15 minutes. The measurement behind it is the harness run of 2026-11-03:
  # `scripts/ci-playwright-e2e.sh` on a macOS laptop over this jar, `4 passed (19.5s)` and exit 0,
  # 37 s from preflight to a dropped database (9 s to liveness, `vite build` 5.41 s, the suite
  # 19.5 s). What a runner adds to that is setup this machine had already paid for once — `npm ci`,
  # a cold `postgres:15` pull, the ~130 MB chromium download — which is why the ceiling is fifteen
  # times the measured work rather than a rounded guess.
  #
  # `retries: 0` and one worker live in `gms_frontend/playwright.config.js` rather than as flags on
  # this job's command line, and each buys something: a red run is a finding rather than a flake that
  # passed on the second attempt (this repository already records a gate that hides failures as worse
  # than one that never ran), and one worker is what lets each test provision its own tenant against
  # the single shared `gms` database this job's sidecar holds — two workers inventing tenants
  # concurrently make the verdict depend on who won the race. Keeping both in the config is also what
  # makes a laptop run and a CI run assert the same thing; the same reasoning that keeps the suite
  # list in the harness instead of in this file.
  playwright_e2e:
    name: Playwright e2e
    needs: [backend, verification_scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The same sidecar `live-tenancy` runs: `postgres:15`, the major the operator's own server runs,
      # published to the runner's own loopback and to nothing outside the job. The suite does not talk
      # to it directly — every journey step goes through the backend over HTTP and through
      # `/api/v1` on the preview server — but the tenants the journey provisions land here, which is
      # why the boot and the browser have to be given the same one database.
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: gms
          POSTGRES_USER: gms_user
          # Not a credential, for all the reasons the `live-tenancy` job gives: an empty cluster that
          # exists for the length of this job on a loopback interface inside a throwaway VM, with
          # tenants and passwords invented per run and nothing in the repository able to reach it
          # afterwards. An unset secret expands to the empty string and PostgreSQL 15 refuses to
          # initialise without a password, so the literal is what keeps a missing secret from turning
          # into a red gate that says nothing about the product.
          POSTGRES_PASSWORD: ci_password
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --name gms-postgres
          --health-cmd "pg_isready -U gms_user -d gms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      GMS_CI_WORK_DIR: ${{ github.workspace }}/playwright-e2e-work
      DB_URL: jdbc:postgresql://127.0.0.1:5432/gms
      DB_USERNAME: gms_user
      DB_PASSWORD: ci_password
      GMS_PG_CONTAINER: gms-postgres
      GMS_PG_USER: gms_user
      GMS_PG_PASSWORD_ENV: DB_PASSWORD
      # Two names the `live-tenancy` job carries are deliberately absent here, because this job runs
      # no `verify-*.sh`: `GMS_BASE_URL`, which those scripts read as their target, and
      # `GMS_VERIFY_DB`, which names the database they check against. The browser suite has one
      # origin (`GMS_E2E_API_ORIGIN`, below) and one database — the per-run one the harness mints
      # from `GMS_E2E_TAG`. `ci-playwright-e2e.sh:224-229` refuses to export the live gate's
      # database name for the same reason, and setting it at job level would put it back.
      # The platform account the harness boots the application with and the journey logs in as — the
      # same two literals `live-tenancy` already carries, for the same reason: no repository secret is
      # read here, because the account is invented in an empty cluster on the runner's loopback and
      # exists only for the length of the job.
      GMS_SUPERADMIN_USERNAME: ciplatformadmin
      GMS_SUPERADMIN_PASSWORD: Platform_Verify_2026!
      # The per-run tag: `helpers/api.js` stamps it into every school code it provisions and
      # `ci-playwright-e2e.sh` builds the run's own database name out of it. Two lengths decide
      # what can be put here, and the shorter one wins — the harness refuses a database name that
      # is not `gms_e2e_<1-12 lowercase alphanumerics>` (`ci-playwright-e2e.sh:100`, which is also
      # what keeps the name spellable inside PostgreSQL's 63-byte identifier limit and provably
      # this run's when the teardown drops it by name), and `SchoolRequest.schoolCode` is
      # `@Size(max = 20)` against `E2E<tag><n><label>`. That is why this is `run_number` and not
      # `run_id`: an 11-digit run id plus the `ci` prefix is 13 characters, and the first push
      # would have died on the harness's own guard — measured, not guessed: `ci41488389433` is 13
      # bytes. The repository's own run counter grows by one per push and stays in two or three
      # digits, so neither cap is in sight; the run id does reach twelve digits someday, and a gate
      # that dies on the day its host's counter gains a digit is a gate somebody will delete.
      #
      # What the tag is NOT for, because the comment this replaced said it: uniqueness between two
      # runs sharing one database. Each job gets its own throwaway `postgres:15` container, so
      # there is no second run to collide with on the runner. The place two runs really do share a
      # cluster is a laptop's `gms-postgres`, and there the tag falls back to `date +%s` — so the
      # CI value only has to be legal, addressable in the artifact names, and different from the
      # cluster's own `gms`, which the harness checks separately.
      GMS_E2E_TAG: r${{ github.run_number }}
      GMS_E2E_PLATFORM_USERNAME: ciplatformadmin
      GMS_E2E_PLATFORM_PASSWORD: Platform_Verify_2026!
      # The origin the browser is served from and the origin the preview server proxies `/api` to:
      # the same host and port, so the journey is same-origin and no CORS exception has to be
      # smuggled into a boot that is otherwise the real one — `StartupSecurityValidator` refuses any
      # `cors.allowed-origins` entry containing `localhost`, and this job never asks it to.
      GMS_E2E_API_ORIGIN: http://localhost:8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch the jar the backend job built
        # The same artifact `mvn -B clean verify` produced, so the application this gate exercises is
        # the one the unit and arch tests passed — not a second build that could differ from it.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gms-backend-jar
          path: playwright-e2e-jar

      - name: Where the jar landed
        # The artifact's internal layout is `upload-artifact`'s decision — it strips the path up to the
        # common parent of the matched files — so the name is resolved here rather than assumed by a
        # literal that would fail with "no jar at …" on the day the build changes its name.
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(playwright-e2e-jar/*.jar)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "FATAL: expected exactly one jar in playwright-e2e-jar/, found ${#jars[@]}."
            echo "       The backend job uploads gms_backend/target/*.jar; more than one means the"
            echo "       build now produces two artifacts and this gate cannot say which it booted."
            exit 1
          fi
          echo "GMS_JAR=${jars[0]}" >> "$GITHUB_ENV"
          echo "will boot ${jars[0]}"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'                      # the same Node `Frontend lint and build` runs on
          cache: npm
          cache-dependency-path: gms_frontend/package-lock.json

      - name: Install the frontend dependencies
        # `working-directory` on the step, not a job-level `defaults:` block: `frontend` can afford
        # the default because every one of its commands is a `gms_frontend` command, while this job
        # spans both trees — the jar resolves at the workspace root and the harness is
        # `scripts/ci-playwright-e2e.sh` — so each step has to say which directory it means.
        run: npm ci
        working-directory: gms_frontend

      - name: Install the browser
        # Chromium only. `playwright.config.js` declares one project and one engine, and
        # `--with-deps` is what puts the shared libraries a headless Chromium needs on the runner —
        # without them the failure is a launch error several seconds into the first test, which reads
        # like a defect in the journey and is a missing `libnss3`.
        run: npx playwright install --with-deps chromium
        working-directory: gms_frontend

      - name: Boot the application and run the browser journey
        # One command, and the same command an operator types on a laptop:
        # `scripts/ci-playwright-e2e.sh` owns the boot of the jar, the wait on
        # `/actuator/health/readiness`, the Playwright invocation and the teardown. It boots with no
        # profile, so `StartupSecurityValidator` and the Flyway chain are themselves part of what has
        # to pass before the browser navigates. Its exit code is this step's, and a non-zero one is a
        # finding rather than something to retry. Note what the job deliberately does NOT do: run
        # `npm run build`. `vite preview` — the server `playwright.config.js` starts — serves `dist/`,
        # so the bundle is built inside the harness, next to the boot it is pointed at, rather than
        # half in YAML and half in a script that can then disagree with it.
        run: bash scripts/ci-playwright-e2e.sh

      - name: Upload the browser evidence
        if: always()
        # The HTML report is the console-error list and the trace viewer; the per-run work dir holds
        # the traces and failure screenshots, because the harness sends Playwright's `--output` there
        # rather than leaving it at the config default of `gms_frontend/test-results` — one path that
        # also holds `backend.log` and the suite transcript is the path a reader should have to find.
        # Uploaded on a green run too, because the evidence that no console error fired is what makes
        # the assertion worth having — and `if-no-files-found: ignore`, because a run that dies before
        # Playwright starts has produced neither, and that absence belongs to the step output rather
        # than to a warning here.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-e2e-report
          path: |
            gms_frontend/playwright-report
            playwright-e2e-work
          retention-days: 7
          if-no-files-found: ignore

